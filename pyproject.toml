[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stoneplanner"
version = "0.1.0"
description = "Research software for PCNL access tract planning from autocontoured noncontrast CT. Not for clinical use."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
# Core: geometry, calyx proxy, stone thresholding, validation. Kept light so the
# web image does not carry PyTorch; the heavy parts are extras.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "nibabel>=5.0",
    "scikit-image>=0.21",
]

[project.optional-dependencies]
ingest = ["pydicom>=3.0", "SimpleITK>=2.3"]
# Class IDs in segment.ORGAN_LABELS were checked against TotalSegmentator 2.18.
segment = ["TotalSegmentator>=2.18,<3"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9",
       "itsdangerous>=2.2", "modal>=1.0", "pydicom>=3.0", "dcm2niix>=1.0.20250506",
       "pylibjpeg>=2.0", "pylibjpeg-libjpeg>=2.3", "pylibjpeg-openjpeg>=2.4"]
dev = ["pytest>=7", "ruff>=0.4", "httpx>=0.27", "pydicom>=3.0", "SimpleITK>=2.3",
       "playwright>=1.48"]

[project.scripts]
stoneplanner-ingest = "stoneplanner.ingest:main"
stoneplanner-segment = "stoneplanner.segment:main"
stoneplanner-plan = "stoneplanner.geometry:main"

[tool.setuptools.packages.find]
include = ["stoneplanner*"]   # stoneplanner and stoneplanner_api

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File"]
