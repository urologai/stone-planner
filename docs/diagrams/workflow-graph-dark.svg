<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -48 980 1318" role="img" aria-label="Workflow of the stone planner: a preoperative CT export, postoperative imaging, and a row of the shared case workbook (filled from the operative report and chart, with the MRN on its Key sheet) enter the local ingest page, which de-identifies the CT, records the clinical form, writes a case folder and manual.csv, and keeps the MRN in a separate key file. The de-identified CT is segmented on a GPU service, stones are detected, and the planner checks every candidate tract for collisions and stone reach, ranks them, and shows the top tracts for surgeon review. Saved results and manual.csv feed the validation report.">
  <style>
    .bandtitle { font: 600 15px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #98A4AB; letter-spacing: 0.06em; }
    .node { font: 600 13.5px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #E5E2D8; }
    .sub { font: 400 11px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #98A4AB; }
    .subm { font: 400 10.5px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: #98A4AB; }
    .edge { font: 400 10.5px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: #98A4AB; }
    .leg { font: 400 11.5px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #98A4AB; }
    .tealtxt { fill: #3FBFB2; }
    .ambertxt { fill: #E09A4C; }
    .rosetxt { fill: #E07A88; }
  </style>
  <rect x="0" y="-48" width="980" height="1318" fill="#151B1F"/>
  <g>
    <rect x="30" y="-36" width="22" height="14" rx="3" fill="#1C2429" stroke="#E5E2D8" stroke-width="1.5"/>
    <text class="leg" x="60" y="-25">saved on your computer</text>
    <rect x="220" y="-36" width="22" height="14" rx="3" fill="#1C2429" stroke="#37424A" stroke-width="1.0"/>
    <text class="leg" x="250" y="-25">software step</text>
    <rect x="354" y="-36" width="22" height="14" rx="3" fill="none" stroke="#98A4AB" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text class="leg" x="384" y="-25">temporary, nothing kept</text>
    <rect x="550" y="-36" width="22" height="14" rx="3" fill="#3A1E23" stroke="#E07A88" stroke-width="1.5"/>
    <text class="leg" x="580" y="-25">identifiable</text>
    <rect x="678" y="-36" width="22" height="14" rx="3" fill="#3A2A14" stroke="#E09A4C" stroke-width="1.5"/>
    <text class="leg" x="708" y="-25">you decide</text>
    <rect x="794" y="-36" width="22" height="14" rx="3" fill="#12332F" stroke="#3FBFB2" stroke-width="1.5"/>
    <text class="leg" x="824" y="-25">what the study tests</text>
  </g>

      <defs>
        <marker id="arr" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 4 L0 8 z" fill="#98A4AB"/>
        </marker>
        <marker id="arrTeal" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 4 L0 8 z" fill="#3FBFB2"/>
        </marker>
      </defs>

      <!-- ============ BAND 1 : INGEST ============ -->
      <rect x="8" y="8" width="964" height="422" rx="10" fill="#1A2126"/>
      <text class="bandtitle" x="28" y="38">1 · INGEST, ON YOUR COMPUTER</text>
      <text class="subm rosetxt" x="952" y="38" text-anchor="end">identifiable: approved computer and university server only</text>

      <rect x="40" y="64" width="210" height="60" rx="6" fill="#3A1E23" stroke="#E07A88" stroke-width="1.5"/>
      <text class="node" x="145" y="88" text-anchor="middle">Preop CT study</text>
      <text class="sub" x="145" y="106" text-anchor="middle">noncontrast, DICOM from PACS</text>

      <rect x="276" y="64" width="210" height="60" rx="6" fill="#3A1E23" stroke="#E07A88" stroke-width="1.5"/>
      <text class="node" x="381" y="88" text-anchor="middle">Postop CT or KUB</text>
      <text class="sub" x="381" y="106" text-anchor="middle">DICOM, if one exists</text>

      <rect x="512" y="64" width="210" height="60" rx="6" fill="#3A1E23" stroke="#E07A88" stroke-width="1.5"/>
      <text class="node" x="617" y="88" text-anchor="middle">Case workbook</text>
      <text class="sub" x="617" y="106" text-anchor="middle">Excel, on the university server</text>

      <rect x="748" y="64" width="210" height="60" rx="6" fill="#3A1E23" stroke="#E07A88" stroke-width="1.5"/>
      <text class="node" x="853" y="88" text-anchor="middle">Op report and chart</text>
      <text class="sub" x="853" y="106" text-anchor="middle">colleagues read them</text>

      <path d="M145 124 V174" fill="none" stroke="#98A4AB" stroke-width="1.3" marker-end="url(#arr)"/>
      <path d="M381 124 V150 H185 V174" fill="none" stroke="#98A4AB" stroke-width="1.3" marker-end="url(#arr)"/>
      <text class="edge" x="195" y="166">private temp folder, deleted after</text>
      <path d="M617 124 V174" fill="none" stroke="#98A4AB" stroke-width="1.3" marker-end="url(#arr)"/>
      <path d="M748 94 H724" fill="none" stroke="#98A4AB" stroke-width="1.3" marker-end="url(#arr)"/>
      <path d="M690 124 V150 H853 V174" fill="none" stroke="#98A4AB" stroke-width="1.3" marker-end="url(#arr)"/>
      <text class="edge" x="700" y="166">MRN, study ID</text>

      <rect x="40" y="176" width="210" height="64" rx="6" fill="#1C2429" stroke="#37424A"/>
      <text class="node" x="145" y="200" text-anchor="middle">Folder scan</text>
      <text class="sub" x="145" y="218" text-anchor="middle">lists every series</text>
      <text class="subm" x="145" y="232" text-anchor="middle">axial CT picked, slice mm</text>

      <rect x="276" y="176" width="210" height="64" rx="6" fill="#1C2429" stroke="#37424A"/>
      <text class="node" x="381" y="200" text-anchor="middle">De-identify</text>
      <text class="sub" x="381" y="218" text-anchor="middle">strip tags, flag burned-in text</text>
      <text class="subm" x="381" y="232" text-anchor="middle">DICOM to NIfTI</text>

      <rect x="512" y="176" width="210" height="64" rx="6" fill="#1C2429" stroke="#37424A"/>
      <text class="node" x="617" y="200" text-anchor="middle">Clinical form</text>
      <text class="sub" x="617" y="218" text-anchor="middle">filled from a workbook row</text>
      <text class="subm" x="617" y="232" text-anchor="middle">choices, numbers, no free text</text>

      <rect x="748" y="176" width="210" height="64" rx="6" fill="#1C2429" stroke="#37424A"/>
      <text class="node" x="853" y="200" text-anchor="middle">Study ID</text>
      <text class="sub" x="853" y="218" text-anchor="middle">from the workbook's Key sheet</text>
      <text class="subm" x="853" y="232" text-anchor="middle">MRN goes to the key only</text>

      <path d="M250 208 H274" fill="none" stroke="#98A4AB" stroke-width="1.3" marker-end="url(#arr)"/>
      <path d="M381 240 V270" fill="none" stroke="#98A4AB" stroke-width="1.3" marker-end="url(#arr)"/>
      <path d="M617 240 V270" fill="none" stroke="#98A4AB" stroke-width="1.3" marker-end="url(#arr)"/>
      <path d="M853 240 V270" fill="none" stroke="#98A4AB" stroke-width="1.3" marker-end="url(#arr)"/>

      <rect x="40" y="272" width="918" height="44" rx="6" fill="#3A2A14" stroke="#E09A4C" stroke-width="1.5"/>
      <text class="node ambertxt" x="499" y="291" text-anchor="middle">You check, then press Ingest case</text>
      <text class="sub" x="499" y="307" text-anchor="middle">the axial series is the one picked, any burned-in text warning, every field filled</text>

      <path d="M263 316 V350" fill="none" stroke="#98A4AB" stroke-width="1.3" marker-end="url(#arr)"/>
      <path d="M617 316 V350" fill="none" stroke="#98A4AB" stroke-width="1.3" marker-end="url(#arr)"/>
      <path d="M853 316 V350" fill="none" stroke="#98A4AB" stroke-width="1.3" marker-end="url(#arr)"/>

      <rect x="40" y="352" width="446" height="60" rx="6" fill="#1C2429" stroke="#E5E2D8" stroke-width="1.5"/>
      <text class="node" x="263" y="376" text-anchor="middle">Case folder</text>
      <text class="sub" x="263" y="394" text-anchor="middle">de-identified CT, metadata, clinical form, postop images</text>

      <rect x="512" y="352" width="210" height="60" rx="6" fill="#1C2429" stroke="#E5E2D8" stroke-width="1.5"/>
      <text class="node" x="617" y="376" text-anchor="middle">manual.csv</text>
      <text class="sub" x="617" y="394" text-anchor="middle">one row per case, kept current</text>

      <rect x="748" y="352" width="210" height="60" rx="6" fill="#3A1E23" stroke="#E07A88" stroke-width="2"/>
      <text class="node" x="853" y="376" text-anchor="middle">MRN key file</text>
      <text class="sub" x="853" y="394" text-anchor="middle">separate folder, never shared</text>

      <!-- ============ BAND 2 : SEGMENTATION ============ -->
      <rect x="8" y="446" width="964" height="150" rx="10" fill="#1A2126"/>
      <text class="bandtitle" x="28" y="476">2 · SEGMENTATION</text>

      <path d="M381 412 V498" fill="none" stroke="#98A4AB" stroke-width="1.3" marker-end="url(#arr)"/>
      <text class="edge" x="391" y="438">Open in planner</text>

      <rect x="40" y="500" width="210" height="64" rx="6" fill="none" stroke="#98A4AB" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text class="node" x="145" y="524" text-anchor="middle">Hosted version</text>
      <text class="sub" x="145" y="542" text-anchor="middle">on hold, not deployed</text>
      <text class="subm" x="145" y="556" text-anchor="middle">would keep nothing</text>

      <rect x="276" y="500" width="210" height="64" rx="6" fill="none" stroke="#98A4AB" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text class="node" x="381" y="524" text-anchor="middle">GPU service</text>
      <text class="sub" x="381" y="542" text-anchor="middle">Modal or home PC, set on Admin</text>
      <text class="subm" x="381" y="556" text-anchor="middle">organ map back, nothing kept</text>

      <rect x="512" y="500" width="210" height="64" rx="6" fill="#1C2429" stroke="#37424A"/>
      <text class="node" x="617" y="524" text-anchor="middle">Stone detection</text>
      <text class="sub" x="617" y="542" text-anchor="middle">dense voxels inside the kidney</text>
      <text class="subm" x="617" y="556" text-anchor="middle">volume, density</text>

      <path d="M250 532 H274" fill="none" stroke="#98A4AB" stroke-width="1.3" marker-end="url(#arr)"/>
      <path d="M486 532 H510" fill="none" stroke="#98A4AB" stroke-width="1.3" marker-end="url(#arr)"/>
      <path d="M722 532 H853 V658" fill="none" stroke="#98A4AB" stroke-width="1.3" marker-end="url(#arr)"/>

      <!-- ============ BAND 3 : PLANNING ============ -->
      <rect x="8" y="612" width="964" height="300" rx="10" fill="#1A2126"/>
      <text class="bandtitle" x="28" y="642">3 · PLANNING</text>

      <rect x="40" y="660" width="210" height="64" rx="6" fill="#1C2429" stroke="#37424A"/>
      <text class="node" x="145" y="684" text-anchor="middle">Targets</text>
      <text class="sub" x="145" y="702" text-anchor="middle">stone centers, posterior calyx</text>
      <text class="subm" x="145" y="716" text-anchor="middle">or your own pick</text>

      <rect x="276" y="660" width="210" height="64" rx="6" fill="#1C2429" stroke="#37424A"/>
      <text class="node" x="381" y="684" text-anchor="middle">Skin entry points</text>
      <text class="sub" x="381" y="702" text-anchor="middle">posterior, posterolateral flank</text>
      <text class="subm" x="381" y="716" text-anchor="middle">thousands of candidates</text>

      <rect x="512" y="660" width="210" height="64" rx="6" fill="#3A2A14" stroke="#E09A4C" stroke-width="1.5"/>
      <text class="node ambertxt" x="617" y="684" text-anchor="middle">Parameters</text>
      <text class="sub" x="617" y="702" text-anchor="middle">scope sweep, depth, margins</text>
      <text class="subm" x="617" y="716" text-anchor="middle">placeholders for surgeons</text>

      <rect x="748" y="660" width="210" height="64" rx="6" fill="#1C2429" stroke="#E5E2D8" stroke-width="1.5"/>
      <text class="node" x="853" y="684" text-anchor="middle">Organ and stone maps</text>
      <text class="sub" x="853" y="702" text-anchor="middle">kidneys, colon, spleen, liver,</text>
      <text class="sub" x="853" y="716" text-anchor="middle">lung, ribs, spine, stones</text>

      <path d="M145 724 V768" fill="none" stroke="#98A4AB" stroke-width="1.3" marker-end="url(#arr)"/>
      <path d="M381 724 V768" fill="none" stroke="#98A4AB" stroke-width="1.3" marker-end="url(#arr)"/>
      <path d="M617 724 V768" fill="none" stroke="#98A4AB" stroke-width="1.3" marker-end="url(#arr)"/>
      <path d="M853 724 V746 H700 V768" fill="none" stroke="#98A4AB" stroke-width="1.3" marker-end="url(#arr)"/>

      <rect x="40" y="770" width="682" height="124" rx="8" fill="none" stroke="#37424A" stroke-dasharray="3 4"/>
      <text class="subm" x="56" y="790">every entry point and target pair</text>

      <rect x="52" y="802" width="206" height="80" rx="6" fill="#1C2429" stroke="#37424A"/>
      <text class="node" x="155" y="826" text-anchor="middle">Collision check</text>
      <text class="sub" x="155" y="844" text-anchor="middle">colon, spleen, liver, lung, rib</text>
      <text class="sub" x="155" y="860" text-anchor="middle">any hit rules the tract out</text>

      <rect x="278" y="802" width="206" height="80" rx="6" fill="#1C2429" stroke="#37424A"/>
      <text class="node" x="381" y="826" text-anchor="middle">Rigid reach</text>
      <text class="sub" x="381" y="844" text-anchor="middle">share of the stone a rigid</text>
      <text class="sub" x="381" y="860" text-anchor="middle">scope reaches from this tract</text>

      <rect x="504" y="802" width="206" height="80" rx="6" fill="#1C2429" stroke="#37424A"/>
      <text class="node" x="607" y="826" text-anchor="middle">Flexible reach</text>
      <text class="sub" x="607" y="844" text-anchor="middle">same, with a wider sweep</text>
      <text class="sub" x="607" y="860" text-anchor="middle">reported, not ranked on</text>

      <path d="M722 842 H746" fill="none" stroke="#3FBFB2" stroke-width="1.3" marker-end="url(#arrTeal)"/>

      <rect x="748" y="800" width="210" height="84" rx="6" fill="#12332F" stroke="#3FBFB2" stroke-width="1.5"/>
      <text class="node tealtxt" x="853" y="824" text-anchor="middle">Ranked tracts</text>
      <text class="sub" x="853" y="842" text-anchor="middle">reach minus soft penalties</text>
      <text class="sub" x="853" y="858" text-anchor="middle">(colon, pleura, supracostal)</text>
      <text class="subm" x="853" y="874" text-anchor="middle">best per calyceal group</text>

      <!-- ============ BAND 4 : REVIEW ============ -->
      <rect x="8" y="928" width="964" height="150" rx="10" fill="#1A2126"/>
      <text class="bandtitle" x="28" y="958">4 · REVIEW</text>

      <path d="M853 884 V980" fill="none" stroke="#98A4AB" stroke-width="1.3" marker-end="url(#arr)"/>

      <rect x="40" y="982" width="210" height="66" rx="6" fill="none" stroke="#98A4AB" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text class="node" x="145" y="1006" text-anchor="middle">Hosted version</text>
      <text class="sub" x="145" y="1024" text-anchor="middle">Save case downloads a zip</text>
      <text class="subm" x="145" y="1038" text-anchor="middle">nothing stays on the server</text>

      <rect x="276" y="982" width="210" height="66" rx="6" fill="#1C2429" stroke="#E5E2D8" stroke-width="1.5"/>
      <text class="node" x="381" y="1006" text-anchor="middle">Save to case folder</text>
      <text class="sub" x="381" y="1024" text-anchor="middle">maps and tracts; reopening</text>
      <text class="sub" x="381" y="1038" text-anchor="middle">skips the work</text>

      <rect x="512" y="982" width="210" height="66" rx="6" fill="#3A2A14" stroke="#E09A4C" stroke-width="1.5"/>
      <text class="node ambertxt" x="617" y="1006" text-anchor="middle">You review</text>
      <text class="sub" x="617" y="1024" text-anchor="middle">fix organs or stones in Slicer</text>
      <text class="subm" x="617" y="1038" text-anchor="middle">corrections are logged</text>

      <rect x="748" y="982" width="210" height="66" rx="6" fill="#1C2429" stroke="#37424A"/>
      <text class="node" x="853" y="1006" text-anchor="middle">Planner view</text>
      <text class="sub" x="853" y="1024" text-anchor="middle">CT, organs, stones, top 3 tracts</text>
      <text class="subm" x="853" y="1038" text-anchor="middle">browser or 3D Slicer</text>

      <path d="M748 1015 H724" fill="none" stroke="#98A4AB" stroke-width="1.3" marker-end="url(#arr)"/>
      <path d="M512 1015 H488" fill="none" stroke="#98A4AB" stroke-width="1.3" marker-end="url(#arr)"/>

      <!-- ============ BAND 5 : VALIDATION ============ -->
      <rect x="8" y="1094" width="964" height="166" rx="10" fill="#1A2126"/>
      <text class="bandtitle" x="28" y="1124">5 · VALIDATION</text>

      <path d="M381 1048 V1146" fill="none" stroke="#98A4AB" stroke-width="1.3" marker-end="url(#arr)"/>

      <rect x="40" y="1148" width="210" height="84" rx="6" fill="#1C2429" stroke="#E5E2D8" stroke-width="1.5"/>
      <text class="node" x="145" y="1172" text-anchor="middle">Clinical data</text>
      <text class="sub" x="145" y="1190" text-anchor="middle">manual.csv from the form:</text>
      <text class="sub" x="145" y="1206" text-anchor="middle">calyx used, stone free,</text>
      <text class="sub" x="145" y="1222" text-anchor="middle">residual size</text>

      <rect x="276" y="1148" width="210" height="84" rx="6" fill="#1C2429" stroke="#37424A"/>
      <text class="node" x="381" y="1172" text-anchor="middle">validate.py</text>
      <text class="sub" x="381" y="1190" text-anchor="middle">reads every case folder</text>
      <text class="sub" x="381" y="1206" text-anchor="middle">on your computer</text>

      <path d="M250 1190 H274" fill="none" stroke="#98A4AB" stroke-width="1.3" marker-end="url(#arr)"/>
      <path d="M486 1190 H510" fill="none" stroke="#3FBFB2" stroke-width="1.3" marker-end="url(#arrTeal)"/>

      <rect x="512" y="1148" width="446" height="84" rx="6" fill="#12332F" stroke="#3FBFB2" stroke-width="1.5"/>
      <text class="node tealtxt" x="735" y="1172" text-anchor="middle">Validation report</text>
      <text class="sub" x="735" y="1190" text-anchor="middle">Did the top tract match the calyx actually used?</text>
      <text class="sub" x="735" y="1206" text-anchor="middle">Automatic vs manual stone volume, within 10%?</text>
      <text class="sub" x="735" y="1222" text-anchor="middle">Does predicted reach track residual fragments?</text>
</svg>
